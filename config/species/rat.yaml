# Rat species configuration (PLAN.md P1). Selected with --species rat (default).
#
# Every value here equals the pre-P1 code constant or argparse default, so
# rat output is byte-identical (checked by ./regress.sh).
#
# Keys:
#   species         name recorded in the output (HDF5 attr `species`)
#   delays          REQUIRED (decision D2): this species' conduction delays.
#                   Always in this file, so it cannot mix with another species'.
#   neuron_profile  abstract | adult (decision D6; `adult` = species-fitted,
#                   MN5 production only, Phase 9)
#   body            anthropometry used to derive path lengths (Phase 2)
#   constants       module-level constants of cpg_2legs_fast.py, grouped for
#                   readability. Every name must already exist in the model.
#   cli_defaults    argparse defaults (dest names). Explicit CLI flags win.
#   connectivity    optional (PLAN.md P3b): indegree_override: {projection: K*}
#                   for --conn-rule indegree; projection keys as in the HDF5
#                   attribute conn_table_json.

species: rat
description: Two-leg rat spinal CPG (tinyCPG baseline; regression reference).
neuron_profile: abstract
body: {}

constants:
  drive:
    BS_REGULAR_HZ: 60.0        # tonic reticulospinal rate (--debug-small forces 20)
    FLEXOR_BS_GAIN: 1.0        # flexor-phase BS gain (MOD_FLEXBOOST)
  afferents:
    CUT_RATE_ON_HZ: 100.0      # cutaneous peak rate during stance
    CUT_RATE_OFF_HZ: 0.0
    IA_BASE_HZ: 10.0           # Ia rate = base + k_force*force + k_stretch*stretch
    IA_K_FORCE: 6.0
    IA_K_STRETCH: 250.0
    IA_RATE_MAX_HZ: 500.0
  muscle:
    TAU_ACT_RISE_MS: 20.0      # activation time constants (free-running gait)
    TAU_ACT_DECAY_MS: 20.0
    ACT_MAX: 1.2
    ACT_SAT_K: 0.02
    TAU_FORCE_RISE_MS: 30.0    # force time constants (free-running gait)
    TAU_FORCE_DECAY_MS: 30.0
    FORCE_MAX: 25.0
    FORCE_SAT_K: 1.0
    TAU_LENGTH_MS: 260.0
    SHORTEN_GAIN: 0.010
    STRETCH_GAIN: 0.35
  muscle_paced_gait:           # replace the muscle τ above under --paced-gait
    PACED_TAU_ACT_RISE_MS: 40.0
    PACED_TAU_ACT_DECAY_MS: 40.0
    PACED_TAU_FORCE_RISE_MS: 80.0
    PACED_TAU_FORCE_DECAY_MS: 80.0

cli_defaults:
  conn_rule: bernoulli         # P3b: original fixed-p wiring, kept for the rat regression baseline
  gait_scheduler: halfcycle    # original rat scheduler: legs alternate half-strides, no double support
  step_period_ms: 1000.0
  stance_fraction: 0.5
  cut_max_stance_ms: 600.0
  cut_max_swing_ms: 600.0
  fatigue_tau_onset_ms: 400.0
  fatigue_tau_recovery_ms: 600.0
  consolidate_tau_tag_ms: 2000.0
  ia_feedback_gain: 1.0
  cut_feedback_gain: 1.0

# Delays (decision D2: part of the species file, never a separate file).
#   delay_ms = syn_delay_ms + (length_m / velocity_mps) * 1000 + jitter,
#   scaled by --delay-scale, clipped to >= the kernel resolution.
#   model: length_velocity (per-path table) or fixed (legacy DELAY_MS, ... in code).
#   jitter_ms: default for --delay-jitter-ms (Gaussian SD per connection).
# Values equal the pre-P1 DELAY_PRESETS["rat"].
delays:
  model: length_velocity
  jitter_ms: 0.2

  paths:
    cut_to_rg:   {syn_delay_ms: 1.0, length_m: 0.005, velocity_mps: 5.0}
    bs_to_rg:    {syn_delay_ms: 1.0, length_m: 0.010, velocity_mps: 5.0}
    base_to_rg:  {syn_delay_ms: 1.0, length_m: 0.010, velocity_mps: 5.0}
    rg_to_m:     {syn_delay_ms: 1.0, length_m: 0.005, velocity_mps: 5.0}
    m_to_mus:    {syn_delay_ms: 1.0, length_m: 0.005, velocity_mps: 5.0}
    ia_path:     {syn_delay_ms: 1.0, length_m: 0.010, velocity_mps: 10.0}
    ia_int_to_m: {syn_delay_ms: 1.0, length_m: 0.010, velocity_mps: 10.0}   # = ia_path (P2 split; rat unchanged)
    rg_rec:      {syn_delay_ms: 0.8, length_m: 0.002, velocity_mps: 5.0}
    rg_recip:    {syn_delay_ms: 1.0, length_m: 0.004, velocity_mps: 5.0}
    motor_e2f:   {syn_delay_ms: 1.0, length_m: 0.004, velocity_mps: 5.0}
    motor_f2e:   {syn_delay_ms: 1.0, length_m: 0.004, velocity_mps: 5.0}
    commissural: {syn_delay_ms: 1.0, length_m: 0.006, velocity_mps: 5.0}
