# Human species configuration (PLAN.md P1). Selected with --species human.
#
# STATUS: delays are human since P2 (2026-09-25). Apart from the delays section
# and the body height, every value is still the rat value; each block names the phase
# that replaces it with a human one (see PLAN.md §2 and CLAUDE.md "Rat → human
# parameter map"). Local/debug profile: neuron parameters stay abstract (D6).
#
# Keys: see config/species/rat.yaml.

species: human
description: Two-leg human spinal CPG, abstract (local/debug) profile.
neuron_profile: abstract       # D6: `adult` (species-fitted) only in human_adult.yaml, Phase 9
body:
  height_m: 1.74               # D7: reference adult; path lengths derive from it in Phase 2

constants:
  drive:                       # BS: keep 20-80 Hz (cat/rat proxy, no human recordings)
    BS_REGULAR_HZ: 60.0
    FLEXOR_BS_GAIN: 1.0
  afferents:                   # Phase 4: set against human microneurography
    CUT_RATE_ON_HZ: 100.0
    CUT_RATE_OFF_HZ: 0.0
    IA_BASE_HZ: 10.0
    IA_K_FORCE: 6.0
    IA_K_STRETCH: 250.0
    IA_RATE_MAX_HZ: 100.0      # P4 split: spindle Ia ceiling (human rates are low; to verify)
    IA_K_VEL: 100.0            # P4 split: Hz per length-unit/s of lengthening (primary ending dynamic term; to verify)
    IB_BASE_HZ: 0.0            # P4 split: tendon organs ~silent at rest
    IB_K_FORCE: 6.0            # P4 split: = the old pooled force term (keeps the load-loop drive)
    IB_RATE_MAX_HZ: 150.0      # to verify
    W_IB2RG: 4.5               # P4 split: static Ib -> RG (pA), ~ the end-of-learning pooled Ia -> RG weight
  rge_gate:                    # P5 MOD_RGE_LOAD_GATE (scripts/p5_rge_gate_probe.py): without ground
                               # contact (CUT) RG-E stays subthreshold -- BS, Ia, Ib and any mix of them,
                               # at the Ia/Ib caps and worst-case rates. Rate regime unchanged (the
                               # learned CUT drive still saturates RG-E), so the RG-rate activation
                               # readout and the RG-E -> InE drive keep their calibration.
    I_E_RGE: -35.0             # hyperpolarising bias (rat +1.0): threshold ~36 mV/ms mean drive
    RGE_GATE_SCALE_IA: 0.3     # Ia -> RG-E init 3.5 -> 1.05, Wmax 10 -> 3 (x loading adjustment)
    RGE_GATE_SCALE_IB: 0.6667  # Ib-E -> RG-E 4.5 -> 3.0 (Ib-F -> RG-F keeps W_IB2RG)
  muscle:                      # Phase 4: soleus (E) / tibialis anterior (F), D3
    TAU_ACT_RISE_MS: 20.0
    TAU_ACT_DECAY_MS: 20.0
    ACT_MAX: 1.2
    ACT_SAT_K: 0.02
    TAU_FORCE_RISE_MS: 30.0
    TAU_FORCE_DECAY_MS: 30.0
    FORCE_MAX: 25.0
    FORCE_SAT_K: 1.0
    MUSCLE_TAU_SCALE_E: 1.25     # P4: soleus (slow): paced force τ 80 -> 100 ms (twitch ~100 ms; to verify)
    MUSCLE_TAU_SCALE_F: 0.625    # P4: tibialis anterior: 80 -> 50 ms (MU time-to-peak ~46 ms)
    TAU_LENGTH_MS: 400.0         # P4: 260 x (human ~600 ms / rat ~390 ms stance)
    SHORTEN_GAIN: 0.0065         # P4: x 260/400, same equilibrium excursion (gain x tau)
    STRETCH_GAIN: 0.2275         # P4: x 260/400
  muscle_paced_gait:
    PACED_TAU_ACT_RISE_MS: 40.0
    PACED_TAU_ACT_DECAY_MS: 40.0
    PACED_TAU_FORCE_RISE_MS: 80.0
    PACED_TAU_FORCE_DECAY_MS: 80.0

cli_defaults:                  # P3: phase scheduler + stance 0.60; P5: human strides, rescaled caps/τ
  swing_end: flexor            # P5: force-trigger touchdown also when the flexor burst ends
  swing_afferent_tau_ms: 150.0 # P5: swing flexor afferent decays over swing (hip-flexor stretch falls; to verify)
  liftoff_needs_contra_stance: true  # P5: a leg lifts off only while the other is in stance (interlimb load rule)
  muscle_length_model: ankle   # P4: soleus/TA share one ankle angle (antagonist length coupling)
  afferent_model: split        # P4: separate spindle Ia (length/velocity) and tendon-organ Ib (force)
  conn_rule: indegree          # P3b: size-invariant wiring, K* = p x production source size
  gait_scheduler: phase        # P3: per-leg phase schedule (double support when stance > 0.5)
  step_period_ms: 1000.0       # P5 sets human strides per mode
  stance_fraction: 0.60        # comfortable human walking: ~60% stance, ~10% double support per transition
  cut_max_stance_ms: 600.0
  cut_max_swing_ms: 600.0
  fatigue_tau_onset_ms: 400.0
  fatigue_tau_recovery_ms: 600.0
  consolidate_tau_tag_ms: 2000.0
  ia_feedback_gain: 1.0
  cut_feedback_gain: 1.0

# Delays (decision D2: part of the species file). Formula: see rat.yaml.
# PLAN.md P2 (2026-09-25). Peripheral paths use length_frac_height x body.height_m
# (1.74 m -> lengths in brackets); intraspinal paths keep absolute lengths.
# All anatomical fractions and velocities are ESTIMATES TO VERIFY (anthropometry,
# e.g. Winter 2009; human nerve-conduction norms). They are chosen so the model's
# Ia -> muscle loop lands at ~30-35 ms, the human soleus stretch/H-reflex range
# (Palmieri et al. 2004); scripts/probe_reflex_latency.py measures it.
#   soleus spindle <-> L5/S1 segments (conus ~L1 vertebra): ~0.47 H  [0.82 m]
#   plantar sole -> lumbar cord:                             ~0.65 H  [1.13 m]
#   medulla -> lumbar enlargement (reticulospinal):          ~0.25 H  [0.44 m]
delays:
  model: length_velocity
  jitter_ms: 0.2

  paths:
    # --- peripheral (scale with height) ---
    ia_path:     {syn_delay_ms: 1.0, length_frac_height: 0.47, velocity_mps: 65.0}  # Ia afferent, ~13.6 ms
    m_to_mus:    {syn_delay_ms: 1.0, length_frac_height: 0.47, velocity_mps: 55.0}  # alpha-motor axon + NMJ, ~15.9 ms
    cut_to_rg:   {syn_delay_ms: 1.0, length_frac_height: 0.65, velocity_mps: 50.0}  # plantar A-beta afferent, ~23.6 ms
    # --- descending (tonic drive: timing matters little) ---
    bs_to_rg:    {syn_delay_ms: 1.0, length_frac_height: 0.25, velocity_mps: 60.0}  # reticulospinal, ~8.3 ms
    base_to_rg:  {syn_delay_ms: 1.0, length_frac_height: 0.25, velocity_mps: 60.0}
    # --- intraspinal (absolute, ~1-2 ms; synaptic delay dominates) ---
    ia_int_to_m: {syn_delay_ms: 1.0, length_m: 0.010, velocity_mps: 20.0}
    rg_to_m:     {syn_delay_ms: 1.0, length_m: 0.020, velocity_mps: 30.0}
    rg_rec:      {syn_delay_ms: 0.8, length_m: 0.010, velocity_mps: 25.0}
    rg_recip:    {syn_delay_ms: 1.0, length_m: 0.015, velocity_mps: 25.0}
    motor_e2f:   {syn_delay_ms: 1.0, length_m: 0.015, velocity_mps: 25.0}
    motor_f2e:   {syn_delay_ms: 1.0, length_m: 0.015, velocity_mps: 25.0}
    commissural: {syn_delay_ms: 1.0, length_m: 0.040, velocity_mps: 30.0}
