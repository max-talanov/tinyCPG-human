# Human locomotion modes (PLAN.md Phase 5). Read by run_human_modes.sh and
# scripts/cpg_modes_stages.py --modes-config.
#
# stride_ms / stance_fraction: healthy adult walking (Perry & Burnfield 2010;
# Winter 2009 -- to verify): slow ~1300-1500 ms / 0.62-0.65, comfortable
# (self-selected, ~1.2-1.4 m/s) ~1000-1200 ms / 0.60, fast ~900 ms / 0.57.
# Strides are shifted ~1% off multiples of the 100 ms gate tick (--rate-update-ms;
# rat "tick-alignment fragility", CLAUDE.md), and so are the derived durations.
#
# loading: --ia-feedback-gain and --cut-feedback-gain. Body-weight-supported (BWS)
# treadmill stepping replaces the rat toe/air stepping: loading = 1 - BWS fraction.
#
# force: first-guess force-trigger timing (--cut-trigger force), the rat medium
# operating point (stride 1000, cap 450, fatigue onset/recovery 260/600, lead 150,
# tau_tag 2000; measured rat stance ~390 ms) scaled by the mode's human stance
# (stride x stance_fraction) / 390 ms. tau_tag x10 when unloaded (rat toe rule:
# tau_tag scales with bout length and loading). off_frac kept at the rat 0.35.
# Tuned at debug-small, comfortable (PLAN.md P5 rounds 1-5, 2026-09-27): swing ends
# on the flexor burst (--swing-end flexor, swing_end_f_frac 0.65) with a phasic swing
# afferent (tau 150 ms); fatigue recovery is NOT scaled (600 ms, the rat value; the
# scaled 1020 ms kept the extensor fatigued through swing); fatigue onset 520 ms at
# comfortable, scaled by stance for the other modes. Round 7: caps = 1.5 x the mode's
# longest target bout (a true failsafe, not the operating point); fast adds the rat
# fast-mode leg fatigue asymmetry (0.04) against L/R synchronisation; BWS tries an
# earlier onset and a higher release fraction. Rounds 8-9: slow onset 620, fast
# onset 330 / recovery 300 (a 300 ms swing needs faster extensor recovery), BWS onset
# 460 / off_frac 0.40. Round 10 (P5 fast L/R, 2026-09-28): the RG-E load gate
# (MOD_RGE_LOAD_GATE) and the interlimb liftoff rule (species default) replace the
# fast-mode leg fatigue asymmetry, which set the two legs to different cadences (drift).
#
# init_from: <mode> -- a trained start (MOD_INIT_WEIGHTS): the run begins from the
# end-of-run weights of that mode (same TAG directory, run first). BWS stepping is done by
# trained adults; from a naive start the load gate never opens at half loading (P5 round
# 10). TRAINED=0 in run_human_modes.sh gives the naive start. init_scale (round 12): an
# injured start, the trained weights scaled down (pathways weakened after SCI; to verify),
# set per BWS level where the load gate just opens, so training rebuilds them and the
# rehabilitation is visible. From the full trained weights the extensor is saturated from
# the start and nothing changes. BWS 90% learns ~10x slower (CUT 10 Hz vs 50 Hz).
# Round 13: BWS strides were short (BWS 90% -37%): the loading gain also scaled the flexor
# Ia, so the swing burst sagged and swing ended early. Species default
# flexor_afferent_loading: ib; BWS 50% swing_end_f_frac 0.47.
# P6 (2026-09-29): capture calibration (species PRP threshold 10; BWS tau_tag 3400, was
# 34200): 2-3 captures per session, recovery builds over sessions. Walking modes start
# trained (init_from itself: its converged P5 run in SRC_DIR); BWS injured, as before.
#
# Round 11 (P5 BWS L/R phase lock, 2026-09-28): with fatigue ending each stance, the
# liftoff rule allows any phase 0.36-0.64 and nothing centres it (BWS 50% locked at
# 0.36). Stance now ends on weight transfer (species default load_transfer_tau_ms 20,
# extensor fatigue onset 1000 ms), at a 50 ms gate tick (run_human_modes.sh TICK=50; at
# 100 ms the post-touchdown delay cannot drop below 200 ms). Stride = 2 x (delay + swing)
# and stance = 50% + delay, so off_frac sets the delay (double support) and
# swing_end_f_frac the swing. Fast stays at stance ~0.63: the delay floor is ~100 ms
# at a 50 ms tick, fast walking needs ~60 ms.
# Fast stride (2026-10-03, spinal rule): stride 990/890, stance ~587 / swing ~406 ms
# (target 507/383); the post-touchdown delay (~90 ms) is set by CUT and motor conduction
# (24 + 16 ms) plus the soleus force decay to off_frac, so the weight-transfer tau does not
# shorten it (10 ms: stride 1002). Fast: on_frac 0.88 / off_frac 0.85 (off must stay below
# on; liftoff needs a smaller force drop) and swing_end_f_frac 0.62 -> stride 892, stance
# 0.59, r(E,F) -0.80 (debug-small). on_frac (default 0.80) is a per-mode key now.
# Production swings are shorter than debug-small ones for this mode (swing_end 0.62: debug
# 883, production 845), and no value fits both within 5% (0.58: 935 / 863). Set for
# production: swing_end_f_frac 0.55 -> production stride 902, stance 0.57, r(E,F) -0.81,
# r(E_L,E_R) -0.95 (naive 120 s, one seed); debug-small runs ~8% long (966 +- 19).

modes:
  slow:
    label: "slow walk"
    stride_ms: 1410
    stance_fraction: 0.63
    loading: 1.0
    init_from: slow         # P6: healthy = trained (its own converged P5 run, SRC_DIR)
    force: {cap_ms: 1330, fatigue_onset_ms: 620, fatigue_recovery_ms: 600, lead_offset_ms: 340,
            off_frac: 0.4, tau_tag_ms: 4600,
            swing_end_f_frac: 0.55, swing_afferent_tau_ms: 150}
  comfortable:
    label: "comfortable walk"
    stride_ms: 1110
    stance_fraction: 0.60
    loading: 1.0
    init_from: comfortable         # P6: healthy = trained (its own converged P5 run, SRC_DIR)
    force: {cap_ms: 1000, fatigue_onset_ms: 480, fatigue_recovery_ms: 600, lead_offset_ms: 260,
            off_frac: 0.75, tau_tag_ms: 3400,
            swing_end_f_frac: 0.55, swing_afferent_tau_ms: 150}
  fast:
    label: "fast walk"
    stride_ms: 890
    stance_fraction: 0.57
    loading: 1.0
    tick_ms: 25              # round 12: the post-touchdown delay floor is ~2 ticks; fast needs ~60 ms
    init_from: fast         # P6: healthy = trained (its own converged P5 run, SRC_DIR)
    force: {cap_ms: 760, fatigue_onset_ms: 330, fatigue_recovery_ms: 300, lead_offset_ms: 210,
            on_frac: 0.88, off_frac: 0.85, tau_tag_ms: 2600,
            swing_end_f_frac: 0.55, swing_afferent_tau_ms: 150}
  bws50:
    label: "BWS 50%"
    stride_ms: 1110
    stance_fraction: 0.60
    loading: 0.5
    init_from: comfortable
    init_scale: 0.25          # round 12: injured start, trained weights x0.25 (gate just opens)
    force: {cap_ms: 1000, fatigue_onset_ms: 460, fatigue_recovery_ms: 600, lead_offset_ms: 260,
            off_frac: 0.75, tau_tag_ms: 3400,
            swing_end_f_frac: 0.47, swing_afferent_tau_ms: 150}
  bws90:
    label: "BWS 90% (air)"
    stride_ms: 1110
    stance_fraction: 0.60
    loading: 0.1
    init_from: comfortable
    init_scale: 0.65          # round 12: injured start, trained weights x0.65 (gate just opens)
    force: {cap_ms: 1000, fatigue_onset_ms: 460, fatigue_recovery_ms: 600, lead_offset_ms: 260,
            off_frac: 0.75, tau_tag_ms: 3400,
            swing_end_f_frac: 0.55, swing_afferent_tau_ms: 150}
